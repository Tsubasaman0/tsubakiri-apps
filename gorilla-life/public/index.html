function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

// 文字マップ→オフスクリーンcanvas。'.'は透明
function makeSprite(map, pal){
  const h = map.length, w = map[0].length;
  const c = document.createElement("canvas"); c.width=w; c.height=h;
  const g = c.getContext("2d");
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const ch = map[y][x];
    if(ch==='.') continue;
    g.fillStyle = pal[ch]; g.fillRect(x,y,1,1);
  }
  return c;
}

function ensureSocial(){
  if(!S) return;
  if(!S.social) S.social = { dokyo:10, seiketsu:10, kiku:10, warai:10, moriage:10, leader:10, shinshi:10 };

// ---------- ダンジョン ----------
const MW=40, MH=22, TILE=40, VC=13, VR=15;
let DVIEW=null;
let D = null; // {map, seen, ex, ey, enemies, items, floor, boss, turn, kidsInParty}

// ---------- ダンジョン タイルテクスチャ(3階ごとに雰囲気を切替) ----------
// 1-3F:青灰の洞窟 / 4-6F:苔むした遺跡 / 7-9F:赤茶の溶岩帯 / 10F〜:紫の深淵
const FLOOR_THEMES = [
  { wallTop:"#767e94", wallMid:"#565d70", wallDark:"#2c313e", wallShadow:"#181b23",
    floorBase:"#232734", floorLight:"#333a4c", floorDark:"#181b24", crack:"#101219", pebble:"#4a5266" },
  { wallTop:"#8aa072", wallMid:"#4f6a45", wallDark:"#28361f", wallShadow:"#141d0f",
    floorBase:"#26301f", floorLight:"#37452c", floorDark:"#151d10", crack:"#0d1109", pebble:"#5c7a4a" },
  { wallTop:"#b06c46", wallMid:"#7a3d26", wallDark:"#3a1e12", wallShadow:"#1c0d07",
    floorBase:"#341f16", floorLight:"#4a2e1f", floorDark:"#1c110b", crack:"#100905", pebble:"#c2521f" },
  { wallTop:"#8a6fb0", wallMid:"#5a3f78", wallDark:"#2c1f42", wallShadow:"#150c22",
    floorBase:"#241c34", floorLight:"#332748", floorDark:"#140e1f", crack:"#0b0714", pebble:"#8a5fc0" },
];
function themeIdxForFloor(floor){ return clamp(Math.floor((floor-1)/3), 0, FLOOR_THEMES.length-1); }
let TILESET=null; // {themeIdx, floorTiles:[c0,c1,c2], wallTile} キャッシュ(テーマが変わったときだけ作り直す)
function buildTileset(floor){
  const idx = themeIdxForFloor(floor);
  if(TILESET && TILESET.themeIdx===idx) return TILESET;
  const th = FLOOR_THEMES[idx];
  const pal = { B:th.floorBase, L:th.floorLight, D:th.floorDark, C:th.crack, P:th.pebble,
                T:th.wallTop, M:th.wallMid, K:th.wallDark, S:th.wallShadow };
  // 床(16x16): 石畳の目地+バリエーション0=無地/1=ヒビ/2=小石
  function floorRows(variant){
    const rows=[];
    for(let y=0;y<16;y++){
      let row="";
      for(let x=0;x<16;x++){
        const groutX = (x%8===0), groutY = (y%7===0 && (((y/7|0)+variant)%2===0));
        row += (groutX||groutY) ? 'D' : (((x+y*3+variant*5)%11===0) ? 'L' : 'B');
      }
      rows.push(row.split(""));
    }
    if(variant===1){ rows[4][3]='C'; rows[5][4]='C'; rows[5][5]='C'; rows[6][5]='C'; rows[10][11]='C'; rows[11][12]='C'; }
    else if(variant===2){ rows[3][12]='P'; rows[4][11]='P'; rows[12][3]='P'; rows[9][9]='P'; }
    return rows.map(r=>r.join(""));
  }
  const floorTiles = [0,1,2].map(v=>makeSprite(floorRows(v), pal));
  // 壁(16x16): 上1/3=明るい石の上面、下2/3=暗い石+レンガ目地、最下段=影ライン(擬似立体)
  const wallRows=[];
  for(let y=0;y<16;y++){
    let row="";
    for(let x=0;x<16;x++){
      let ch;
      if(y<5) ch = (x+y)%5===0 ? 'T' : 'M';
      else if(y===15) ch = 'S';
      else {
        const brickTop = (y-5)%4===0;
        const offset = (((y-5)/4|0)%2===0) ? 0 : 4;
        const seam = brickTop || ((x+offset)%8===0);
        ch = seam ? 'S' : (((x+y)%7===0) ? 'M' : 'K');
      }
      row += ch;
    }
    wallRows.push(row);
  }
  const wallTile = makeSprite(wallRows, pal);
  TILESET = { themeIdx: idx, floorTiles, wallTile };
  return TILESET;
}
function tileVariant(x,y){ return (x*7+y*13)%3; }

function genFloor(floor){
  const map = Array.from({length:MH},()=>Array(MW).fill(1)); // 1=壁 0=床
  const rooms=[];
  for(let i=0;i<9;i++){
    const w=ri(4,8), h=ri(3,6), x=ri(1,MW-w-2), y=ri(1,MH-h-2);
    rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});
    for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++) map[yy][xx]=0;
  }
  rooms.sort((a,b)=>a.cx-b.cx);
  for(let i=1;i<rooms.length;i++){
    let {cx:ax,cy:ay}=rooms[i-1], {cx:bx,cy:by}=rooms[i];
    while(ax!==bx){ map[ay][ax]=0; ax+= ax<bx?1:-1; }
    while(ay!==by){ map[ay][ax]=0; ay+= ay<by?1:-1; }
  }
  const isBoss = floor%3===0;
  const start = rooms[0], last = rooms[rooms.length-1];
  const enemies=[];
  const n = isBoss? ri(2,3) : ri(4,6);
  for(let i=0;i<n;i++){
    const r = pick(rooms.slice(1));
    const k = ENEMY_KINDS[clamp(ri(0, Math.min(2, ((floor/2)|0))),0,2)];
    const lv = 1 + (floor-1)*0.35;
    enemies.push({x:r.cx+ri(-1,1), y:r.cy+ri(-1,1), kind:k, hp:Math.round(k.hp*lv),
                  maxhp:Math.round(k.hp*lv), atk:Math.round(k.atk*lv), def:k.def, boss:false});
  }
  let boss=null;
  if(isBoss){
    const lv = 1 + floor*0.32;
    boss = {x:last.cx, y:last.cy, kind:null, boss:true,
            name:pick(F_NAMES), persona:pick(PERSONA), flower:pick(FLOWERS),
            hp:Math.round(26*lv), maxhp:Math.round(26*lv), atk:Math.round(5*lv*0.75), def:1};
    boss.sp = makeFemale(boss.flower);
    enemies.push(boss);
  }
  const items=[];
  for(let i=0;i<ri(3,5);i++){
    const r=pick(rooms); const t = Math.random()<0.55 ? "gold":"banana";
    items.push({x:r.cx+ri(-1,1), y:r.cy+ri(-1,1), t});
  }
  const stairs = {x:last.cx===start.cx?last.cx+1:last.cx, y:last.cy};
  return { map, seen:Array.from({length:MH},()=>Array(MW).fill(false)),
           px:start.cx, py:start.cy, enemies, items, stairs, floor, boss,
           bossDown:false, msg:[], turn:0, tileset:buildTileset(floor) };
}
function startExpedition(){
  D = genFloor(1);
  FX=[];
  D.food = S.wife && S.wife.role==="farm";
  D.kids = S.party.map(i=>{
    const k = S.kids[i];
    k.timesTaken = (k.timesTaken||0) + 1; // 覚えている: 連れて行った回数
    return { ref:k, x:D.px, y:D.py+1, hp:20+k.atk*2, maxhp:20+k.atk*2, cd:0 };
  });
  if(D.food){ S.hp = Math.min(S.maxhp+8, S.hp+8); }
  fov();
  dmsg(D.boss? "…この階のずっと下に、つよい気配がする。" : "ダンジョンにもぐった。(Bキー/にげるボタンで帰還)");
  S.mode = "dungeon";
}
function dmsg(t){ D.msg.push(t); if(D.msg.length>4) D.msg.shift(); }
function fov(){
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(Math.abs(x-D.px)<=6 && Math.abs(y-D.py)<=5) D.seen[y][x]=true;
  }
}
function dmg(a, d){ return Math.max(1, a - d + ri(-1,2)); }
function enemyAt(x,y){ return D.enemies.find(e=>e.hp>0 && e.x===x && e.y===y); }
function kidAt(x,y){ return D.kids.find(k=>k.hp>0 && k.x===x && k.y===y); }
function walkable(x,y){ return x>=0&&y>=0&&x<MW&&y<MH&&D.map[y][x]===0; }

function playerStep(dx,dy){
  const nx=D.px+dx, ny=D.py+dy;
  const e = enemyAt(nx,ny);
  if(e){
    const v = dmg(S.atk, e.def); e.hp -= v;
    sfx("attack"); addDmgPopup(nx,ny,"-"+v,"#fff2c9");
    dmsg((e.boss? e.name : e.kind.name)+" に "+v+" ダメージ!");
    if(e.hp<=0) onKill(e);
  } else if(walkable(nx,ny) && !kidAt(nx,ny)){
    D.px=nx; D.py=ny; pickup();
  } else return false;
  endTurn(); return true;
}
function pickup(){
  const i = D.items.findIndex(it=>it.x===D.px&&it.y===D.py);
  if(i>=0){
    const it=D.items[i];
    if(it.t==="gold"){ const g=ri(8,20)+D.floor*4; S.gold+=g; sfx("coin"); dmsg(g+"ゴールドを拾った!"); }
    else { S.hp=Math.min(S.maxhp,S.hp+10); sfx("eat"); dmsg("バナナを食べた。HPが回復!"); }
    D.items.splice(i,1);
  }
  if(D.px===D.stairs.x && D.py===D.stairs.y){
    if(D.boss && !D.bossDown){ dmsg("階段の前に立ちはだかられている!ボスをたおそう。"); }
    else {
      sfx("stairs");
      const f = D.floor+1;
      S.deepestFloor = Math.max(S.deepestFloor, D.floor);
      const kids = D.kids;
      D = genFloor(f);
      D.kids = kids.map(k=>({...k, x:D.px, y:D.py+1}));
      D.food = S.wife && S.wife.role==="farm";
      fov();
      dmsg("地下"+f+"階におりた。");
    }
  }
}
function onKill(e){
  if(e.boss){
    D.bossDown = true;
    S.atk+=1; S.maxhp+=3;
    sfx("levelup"); triggerFlash(8);
    dmsg(e.name+"はひざをついた…!");
    dmsg("激闘をこえて、少しつよくなった!(攻+1 HP+3)");
    openDialog([
      {text:"メスゴリラの「"+e.name+"」("+e.persona.p+")は、あなたの強さに目をかがやかせている。"},
      {text:"「…あんた、なかなかやるじゃない。ついていってあげてもいいけど?」",
       choices:[
         {label:"家に連れて帰る", fn:()=>{ S.candidates.push({name:e.name, persona:e.persona, flower:e.flower});
            dmsg(e.name+"が仲間になった!(家で会える)"); }},
         {label:"ていねいに断る", fn:()=>{ dmsg(e.name+"は少しさみしそうに森へ帰っていった。"); }},
       ]},
    ]);
  } else {
    const g = ri(e.kind.gold[0], e.kind.gold[1]) + D.floor*2;
    S.gold += g;
    sfx("coin");
    dmsg(e.kind.name+"をたおした!("+g+"G)");
  }
}
function kidTurns(){
  if(DIALOG) return;
  for(const k of D.kids){
    if(k.hp<=0) continue;
    const st = k.ref.style;
    if(k.cd>0) k.cd--;
    // サポーター: 主人公のHPが半分以下なら回復
    if(st==="サポーター" && k.cd===0 && S.hp < S.maxhp*0.55){
      const v = 8 + k.ref.sup*2; S.hp=Math.min(S.maxhp,S.hp+v); k.cd=7;
      dmsg(k.ref.name+pick(SUPPORT_LINES)+" HPが"+v+"回復!"); continue;
    }
    // 攻撃対象: 隣接敵
    const adj = D.enemies.find(e=>e.hp>0 && Math.abs(e.x-k.x)+Math.abs(e.y-k.y)===1);
    if(adj){
      const v = dmg(k.ref.atk, adj.def); adj.hp-=v;
      sfx("attack"); addDmgPopup(adj.x,adj.y,"-"+v,"#cfe8ff");
      dmsg(k.ref.name+"のこうげき!"+v+"ダメージ");
      if(adj.hp<=0) onKill(adj);
      continue;
    }
    // 移動: 先陣型は近くの敵へ、他は主人公のそばへ
    let tx=D.px, ty=D.py;
    if(st==="先陣型"){
      const near = D.enemies.filter(e=>e.hp>0 && Math.abs(e.x-k.x)+Math.abs(e.y-k.y)<=5)
                            .sort((a,b)=>(Math.abs(a.x-k.x)+Math.abs(a.y-k.y))-(Math.abs(b.x-k.x)+Math.abs(b.y-k.y)))[0];
      if(near){ tx=near.x; ty=near.y; }
    }
    stepToward(k, tx, ty, (x,y)=> walkable(x,y) && !enemyAt(x,y) && !kidAt(x,y) && !(x===D.px&&y===D.py));
  }
}
function stepToward(o, tx, ty, ok){
  const dx = Math.sign(tx-o.x), dy = Math.sign(ty-o.y);
  const tries = Math.abs(tx-o.x)>=Math.abs(ty-o.y) ? [[dx,0],[0,dy]] : [[0,dy],[dx,0]];
  for(const [mx,my] of tries){
    if((mx||my) && ok(o.x+mx,o.y+my)){ o.x+=mx; o.y+=my; return true; }
  }
  return false;
}
function enemyTurns(){
  if(DIALOG) return;
  for(const e of D.enemies){
    if(e.hp<=0) continue;
    const dp = Math.abs(e.x-D.px)+Math.abs(e.y-D.py);
    const kid = D.kids.filter(k=>k.hp>0).sort((a,b)=>(Math.abs(a.x-e.x)+Math.abs(a.y-e.y))-(Math.abs(b.x-e.x)+Math.abs(b.y-e.y)))[0];
    const dk = kid? Math.abs(kid.x-e.x)+Math.abs(kid.y-e.y) : 99;
    // 隣接攻撃(近い方)
    if(dp===1 && dp<=dk){
      const v = dmg(e.atk, S.def); S.hp-=v;
      sfx("hit"); triggerShake(4); addDmgPopup(D.px,D.py,"-"+v,"#ff8080");
      dmsg((e.boss?e.name:e.kind.name)+"のこうげき!"+v+"ダメージ");
      if(S.hp<=0){ rescued(); return; }
      continue;
    }
    if(kid && dk===1){
      const v = dmg(e.atk, 1); kid.hp-=v;
      sfx("hit"); addDmgPopup(kid.x,kid.y,"-"+v,"#ffb0b0");
      dmsg(kid.ref.name+"が"+v+"ダメージをうけた!");
      if(kid.hp<=0){ dmsg(kid.ref.name+"はたおれた…(家で休めばなおる)"); kid.ref.hap=Math.max(0,kid.ref.hap-5); }
      continue;
    }
    // 追跡 or うろつき
    const target = (kid && dk<dp) ? kid : {x:D.px,y:D.py};
    const dist = Math.min(dp,dk);
    if(dist<=7){ stepToward(e, target.x, target.y, (x,y)=>walkable(x,y)&&!enemyAt(x,y)&&!kidAt(x,y)&&!(x===D.px&&y===D.py)); }
    else if(Math.random()<0.4){
      const [mx,my]=pick([[1,0],[-1,0],[0,1],[0,-1]]);
      if(walkable(e.x+mx,e.y+my)&&!enemyAt(e.x+mx,e.y+my)) { e.x+=mx; e.y+=my; }
    }
  }
}
function kidMurmur(){
  const alive = D.kids.filter(k=>k.hp>0);
  if(!alive.length) return;
  const k = pick(alive);
  const pool = (k.ref.timesTaken||0) >= 3 ? KID_MURMUR_USED : KID_MURMUR_NEW;
  dmsg(k.ref.name+pick(pool));
}
function endTurn(){
  D.turn++;
  if(D.food && D.turn%5===0) S.hp=Math.min(S.maxhp,S.hp+1);
  if(D.kids.length && D.turn%10===0 && Math.random()<0.35) kidMurmur();
  kidTurns(); enemyTurns(); fov();
}
function rescued(){
  sfx("death");
  const lost = Math.floor(S.gold/2); S.gold-=lost;
  openDialog([
    {text:"目のまえがまっくらになった…。"},
    {text:"気がつくと、家のふとんの中だった。("+lost+"ゴールドを落としてしまった)"},
  ], ()=> returnHome(false));
}
function nearestEnemyDist(){
  let d=99;
  for(const e of D.enemies){ if(e.hp>0) d=Math.min(d, Math.abs(e.x-D.px)+Math.abs(e.y-D.py)); }
  return d;
}
function tryFlee(){
  if(nearestEnemyDist()<=4){
    sfx&&sfx("hit");
    dmsg("敵が近くにいて、つるにつかまれない!");
    dmsg("ふりきるか、たおしてから逃げよう。");
    return;
  }
  openDialog([{text:"つるにつかまって地上へ帰る?",choices:[
    {label:"帰る",fn:()=>returnHome(true)},
    {label:"まだ潜る",fn:()=>{}},
  ]}]);
}
function returnHome(safe){
  S.mode="home"; D=null; FX=[];
  passYear(safe);
}

// ---------- 1年経過・家族処理 ----------
function passYear(safe){
  S.year++; S.age++;
  S.danranDone=false;
  ensureSocial(); S.free=2;
  const w=S.wife;
  const home=[];
  if(w){
    w.years=(w.years||0)+1;
    if(w.role==="shop"){ const g=Math.round((30+w.years*8)*w.persona.shop); S.gold+=g; home.push("お店のもうけで +"+g+"G!"); }
    if(w.role==="home"){ S.hp=S.maxhp; w.affection=Math.min(100,w.affection+2); home.push(w.name+"がまいにち看病してくれた(全回復)"); }
    if(w.role==="farm"){ home.push("はたけのめぐみで、次の出撃も体力もちがよさそうだ。"); }
    if(safe) w.affection=Math.min(100, w.affection+3);
    if(rankAtLeast("shinshi","B")){ w.affection=Math.min(100, w.affection+2); home.push("あなたの気づかいがうれしい"); }
  }
  if(S.candidates.length){
    const g=S.candidates.length*8; S.gold+=g;
    home.push("村にすむ仲間ゴリラたちが手つだってくれた(+"+g+"G)");
  }
  if(S.plannedBaby && w && S.kids.length<4){
    const name=pick(K_NAMES.filter(n=>!S.kids.some(k=>k.name===n)))||"チビ";
    S.kids.push({name, age:0, policy:"みまもる", atk:3, sup:1, hap:60, style:"みならい", timesTaken:0});
    home.push("あかちゃんが生まれた!名前は「"+name+"」!");
    sfx("baby");
    w.affection=Math.min(100,w.affection+8);
    S.plannedBaby=false;
  }
  for(const k of S.kids){
    k.age++;
    const bonus = (w && w.role==="home")? 1.4 : 1.0;
    if(k.policy==="きたえる"){ k.atk+=Math.round(2*bonus); k.hap+= (k.hap>50? -1: 1); }
    if(k.policy==="まなぶ"){ k.sup+=Math.round(2*bonus); k.hap+=1; }
    if(k.policy==="みまもる"){ k.atk+=1; k.sup+=1; k.hap+=Math.round(3*bonus); }
    if(rankAtLeast("leader","B")) k.hap+=1;
    k.hap=clamp(k.hap,0,100);
    k.style = k.atk>=k.sup*2 ? (k.atk>=14?"先陣型":"アタッカー") : (k.sup>k.atk? "サポーター" : "アタッカー");
    if(k.age===4) home.push(k.name+"は4さいになった。ダンジョンに連れて行ける!");
  }
  const vig = familyVignette();
  if(vig) home.push(vig);
  S.hp=S.maxhp;
  S.log = home.length? home : ["しずかな1年だった。"];
  save();
  if(S.age>=S.lifespan){ startEpilogue(); return; }
  if(S.age>=S.lifespan-3){
    S.log.push("…さいきん、むねがざわつく。のこされた時間は長くないのかもしれない。");
    S.log.push(twilightLine());
  }
}

// ---------- エンディング ----------
function startEpilogue(){
  const w=S.wife, kids=S.kids;
  const pages=[];
  pages.push("──それから、しばらくのち。");
  pages.push("主人公ゴリラは "+S.age+"さい。ながい一生のおわりが、しずかにやってきた。");
  let score=0;
  if(w){
    score += w.affection>=70? 3 : w.affection>=40? 2 : 0;
    const wl = w.affection>=70? w.name+"は最後の日まで手をにぎっていた。「いい一生だったね」"
             : w.affection>=40? w.name+"は静かに見送った。「おつかれさま、あんた」"
             : w.name+"とは、最後まですこし距離があったままだった…。";
    pages.push(wl);
    const role = w.role==="shop"? w.name+"のお店は村いちばんの人気店になり、あなたの話が今も語られている。"
               : w.role==="farm"? "ふたりで耕したはたけは、村いちばんの実りをつけるようになった。"
               : w.role==="home"? "あたたかい家庭は、村じゅうのあこがれだった。"
               : null;
    if(role) pages.push(role);
  } else {
    pages.push("結婚はしなかった。強さの記録だけが、洞窟の壁にきざまれている。");
  }
  if(kids.length===0 && w) pages.push("ふたりの思い出は、だれにも継がれずに消えていく…。");
  for(const k of kids){
    score += (k.hap>=60?1:0) + ((k.atk>=16||k.sup>=12)?1:0) - (k.hap<25?2:0);
    let f;
    if(k.hap<25) f = k.name+"は家を出たきり、もどらなかった…。";
    else if(k.style==="先陣型") f = k.name+"は伝説の冒険ゴリラとなり、あなたをこえる強さで一族を守った。";
    else if(k.style==="サポーター") f = k.name+"はみんなを支えるいやし手になり、村に診療所をひらいた。";
    else if(k.atk>=16) f = k.name+"はたのもしい戦士に育ち、ダンジョンの深くまで名をとどろかせた。";
    else if(k.hap>=75) f = k.name+"はしあわせな家庭を築き、にぎやかな笑い声がたえなかった。";
    else f = k.name+"は自分のペースで、ゆっくりと自分の道をみつけた。";
    pages.push(f);
  }
  if(S.gold>=800){ score+=2; pages.push("のこした"+S.gold+"ゴールドの遺産は、家族のくらしを長く支えた。"); }
  else if(S.gold>=300){ score+=1; }
  pages.push("とうたつした最深記録: 地下"+S.deepestFloor+"階");
  familyLetters().forEach(t=>pages.push(t));
  let title;
  if(!w) title = score>=2? "── 孤高の王 END ──" : "── ひとりぼっちの強者 END ──";
  else if(score>=6) title = "── だいだいだい満足のハッピーエンド ──";
  else if(score>=3) title = "── まずまずの一生 END ──";
  else title = "── すこしさみしい END ──";
  if(title==="── だいだいだい満足のハッピーエンド ──") pages.push("──家族はきょうも、あなたの話をしている。");
  pages.push(title);
  pages.push("(Enter/タップでタイトルへ)");
  S.mode="epilogue"; S.epPages=pages; S.epIdx=0;
  try{ localStorage.removeItem("gorilla-life"); }catch(e){}
}

// ---------- ダイアログ ----------
let DIALOG=null; // {queue, idx, choiceIdx, onEnd}
function openDialog(queue, onEnd){
  if(DIALOG){
    DIALOG.queue.push(...queue);
    if(onEnd){ const old=DIALOG.onEnd; DIALOG.onEnd = old? ()=>{ old(); onEnd(); } : onEnd; }
    return;
  }
  DIALOG={queue, idx:0, choiceIdx:0, onEnd};
}
function dialogInput(key){
  const cur=DIALOG.queue[DIALOG.idx];
  if(cur.choices){
    if(key==="up") DIALOG.choiceIdx=(DIALOG.choiceIdx+cur.choices.length-1)%cur.choices.length;
    else if(key==="down") DIALOG.choiceIdx=(DIALOG.choiceIdx+1)%cur.choices.length;
    else if(key==="ok"){ const c=cur.choices[DIALOG.choiceIdx]; advanceDialog(); if(c.fn)c.fn(); }
  } else if(key==="ok") advanceDialog();
}
function advanceDialog(){
  DIALOG.idx++; DIALOG.choiceIdx=0;
  if(DIALOG.idx>=DIALOG.queue.length){ const f=DIALOG.onEnd; DIALOG=null; if(f)f(); }
}

let ACTX=null, sfxGain=null, bgmGain=null, muted=false, noiseBuf=null;
try{ muted = localStorage.getItem("gorilla-life-mute")==="1"; }catch(e){}
function ensureAudio(){
  if(ACTX) return ACTX;
  try{
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    ACTX = new AC();
    sfxGain = ACTX.createGain(); sfxGain.gain.value = muted?0:0.5; sfxGain.connect(ACTX.destination);
    bgmGain = ACTX.createGain(); bgmGain.gain.value = muted?0:0.035; bgmGain.connect(ACTX.destination);
  }catch(e){ ACTX=null; }
  return ACTX;
}
function unlockAudio(){
  try{
    const a=ensureAudio();
    if(a && a.state==="suspended") a.resume().catch(()=>{});
  }catch(e){}
}
window.addEventListener("pointerup", unlockAudio);
window.addEventListener("keydown", unlockAudio);
function toggleMute(){
  muted=!muted;
  try{ localStorage.setItem("gorilla-life-mute", muted?"1":"0"); }catch(e){}
  try{
    if(sfxGain) sfxGain.gain.value = muted?0:0.5;
    if(bgmGain) bgmGain.gain.value = muted?0:0.035;
  }catch(e){}
}
function playTone(freq,dur,type,startGain,endGain,delay,dest){
  const a=ACTX; if(!a) return;
  const t0=a.currentTime+(delay||0);
  const osc=a.createOscillator(); const g=a.createGain();
  osc.type=type||"square"; osc.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(startGain,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(endGain,0.0001), t0+dur);
  osc.connect(g); g.connect(dest||sfxGain);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function getNoiseBuf(){
  if(noiseBuf) return noiseBuf;
  const len = Math.floor(ACTX.sampleRate*0.3);
  noiseBuf = ACTX.createBuffer(1,len,ACTX.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return noiseBuf;
}
function playNoise(dur,startGain,cutoff,delay,dest){
  const a=ACTX; if(!a) return;
  const t0=a.currentTime+(delay||0);
  const src=a.createBufferSource(); src.buffer=getNoiseBuf();
  const filt=a.createBiquadFilter(); filt.type="lowpass"; filt.frequency.setValueAtTime(cutoff||200,t0);
  const g=a.createGain(); g.gain.setValueAtTime(startGain,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(filt); filt.connect(g); g.connect(dest||sfxGain);
  src.start(t0); src.stop(t0+dur+0.02);
}

// ---------- BGM本格化: 音名テーブル+多声部+lookaheadスケジューラ ----------
// ジブリ的な空気(あたたかい長調⇄せつない短調・IV-V-vi進行・ペンタトニック混じりの旋律・
// 3拍子のワルツ感・6度跳躍・口ずさめる主題の反復と変奏)を「技法」として使い、旋律は完全オリジナル。
const NOTE_IDX = { C:0,"C#":1,Db:1, D:2,"D#":3,Eb:3, E:4, F:5,"F#":6,Gb:6, G:7,"G#":8,Ab:8, A:9,"A#":10,Bb:10, B:11 };
function noteFreq(name){
  if(!name || name==="R") return 0;
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(name);
  if(!m) return 0;
  const idx = NOTE_IDX[m[1].toUpperCase()+m[2]];
  if(idx===undefined) return 0;
  const midi = (parseInt(m[3],10)+1)*12 + idx; // C4=MIDI60, A4=MIDI69=440Hz
  return 440*Math.pow(2,(midi-69)/12);
}
// 空間系: ConvolverではなくDelay+フィードバック+ローパスで軽い残響を作る(bgmGain手前に常設)
let bgmDry=null, reverbDelay=null, reverbFeedback=null, reverbLPF=null, reverbWet=null;
function ensureBgmFx(){
  if(bgmDry || !ACTX) return;
  bgmDry = ACTX.createGain(); bgmDry.gain.value=1; bgmDry.connect(bgmGain);
  reverbDelay = ACTX.createDelay(1.0); reverbDelay.delayTime.value=0.25;
  reverbFeedback = ACTX.createGain(); reverbFeedback.gain.value=0.25;
  reverbLPF = ACTX.createBiquadFilter(); reverbLPF.type="lowpass"; reverbLPF.frequency.value=2200;
  reverbWet = ACTX.createGain(); reverbWet.gain.value=0.35;
  reverbDelay.connect(reverbFeedback); reverbFeedback.connect(reverbLPF); reverbLPF.connect(reverbDelay);
  reverbDelay.connect(reverbWet); reverbWet.connect(bgmGain);
}
// 1音を鳴らす。attack/releaseで必ず包絡をつけ、ブツ切りのクリックノイズを出さない
function bgmNote(t0, freq, dur, cfg){
  const a=ACTX; if(!a || !freq || dur<=0) return;
  ensureBgmFx();
  const type = cfg.type||"triangle";
  const vol = Math.max(0, (cfg.vol!=null?cfg.vol:0.2) * (cfg.volMul||1));
  const attack = cfg.attack!=null?cfg.attack:0.02;
  const release = cfg.release!=null?cfg.release:Math.max(0.05,dur*0.3);
  const wet = cfg.wet!=null?cfg.wet:0.2;
  const osc=a.createOscillator(); osc.type=type; osc.frequency.setValueAtTime(freq,t0);
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(vol,0.0005), t0+attack);
  const sEnd = Math.max(t0+attack+0.01, t0+dur-release);
  g.gain.setValueAtTime(Math.max(vol,0.0005), sEnd);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur+release);
  let src=osc;
  if(cfg.filterHz){ const f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cfg.filterHz; osc.connect(f); src=f; }
  src.connect(g); g.connect(bgmDry);
  if(wet>0 && reverbDelay){ const s=a.createGain(); s.gain.value=wet; g.connect(s); s.connect(reverbDelay); }
  if(cfg.vibrato){ // 笛/オカリナ風のビブラート(5-6Hz、深さ数セント〜十数セント)
    const lfo=a.createOscillator(); lfo.type="sine"; lfo.frequency.value=cfg.vibratoRate||5.6;
    const ld=a.createGain(); ld.gain.value=cfg.vibrato;
    lfo.connect(ld); ld.connect(osc.detune);
    lfo.start(t0); lfo.stop(t0+dur+release+0.05);
  }
  osc.start(t0); osc.stop(t0+dur+release+0.08);
  if(cfg.extraRatio){ // ピアノ/オルゴール風: 上の倍音をもう1枚重ねる
    const o2=a.createOscillator(); o2.type=cfg.extraType||"sine"; o2.frequency.setValueAtTime(freq*cfg.extraRatio,t0);
    const g2=a.createGain(); g2.gain.setValueAtTime(0.0001,t0);
    const v2 = vol*(cfg.extraVol!=null?cfg.extraVol:0.4);
    g2.gain.exponentialRampToValueAtTime(Math.max(v2,0.0005), t0+attack*0.7);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0+dur+release*0.6);
    o2.connect(g2); g2.connect(bgmDry);
    if(wet>0 && reverbDelay){ const s2=a.createGain(); s2.gain.value=wet; g2.connect(s2); s2.connect(reverbDelay); }
    o2.start(t0); o2.stop(t0+dur+release+0.1);
  }
}
// 音色プリセット: メロディ=三角波+ビブラート(笛)/ハーモニー=控えめな和音/ベース=低域三角/
// ピアノ=sine+triangle重ね速いアタック/オルゴール=sine+高次倍音+長めの残響

// ---- lookaheadスケジューラ(25ms間隔・0.2s先まで予約) ----
let bgmMode=null, musicState=null;
function stopMusic(){ if(musicState && musicState.timer) clearInterval(musicState.timer); musicState=null; }
function startMusic(key){
  const song = SONGS[key]; if(!song || !ACTX) return;
  stopMusic();
  const secPerBeat = 60/song.bpm;
  const parts = song.parts.map(p=>({...p, idx:0, next:ACTX.currentTime+0.05}));
  const st = { key, secPerBeat, parts, timer:null };
  const tick=()=>{
    const horizon = ACTX.currentTime + 0.2;
    for(const part of st.parts){
      while(part.next < horizon){
        const note = part.notes[part.idx % part.notes.length];
        const dur = note[1]*st.secPerBeat;
        if(!muted){
          const cfg = Object.assign({}, VOICE[part.voice], part.cfg||{});
          if(part.volMulFn) cfg.volMul = part.volMulFn();
          const semi = part.pitchFn ? part.pitchFn() : 0;
          const freq = noteFreq(note[0]) * Math.pow(2, semi/12);
          try{ bgmNote(part.next, freq, dur*0.96, cfg); }catch(e){}
        }
        part.next += dur; part.idx++;
      }
    }
  };
  st.timer = setInterval(tick, 25);
  tick();
  musicState = st;
}
function updateBgmForMode(){
  const target = (S===null || S.mode==="title") ? "title"
               : (S.mode==="home"||S.mode==="dungeon"||S.mode==="epilogue") ? S.mode : null;
  if(!ACTX) return; // 初回操作でAudioContextが出来るまで待機(自動再生制限対応)
  if(target!==bgmMode || (target && !musicState)){ bgmMode=target; if(target) startMusic(target); else stopMusic(); }
}

function wrapText(t,x,y,w,size,color){
  ctx.font=size+"px sans-serif"; ctx.fillStyle=color||"#f2efe9";
  let line="", yy=y;
  for(const ch of t){ if(ctx.measureText(line+ch).width>w){ ctx.fillText(line,x,yy); line=ch; yy+=size+9; } else line+=ch; }

// 遠景の山シルエット(x座標のみに依存する決定論的な波形。フレームごとに再計算しても軽い)
function drawMountainLayer(baseY, amp, freq, phase, color){
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(0,960);
  for(let x=0;x<=540;x+=20){
    const yv = baseY - (Math.sin(x*freq+phase)*0.5+0.5)*amp
                      - (Math.sin(x*freq*2.3+phase*1.7)*0.5+0.5)*amp*0.4;
    ctx.lineTo(x,yv);
  }
  ctx.lineTo(540,960); ctx.closePath(); ctx.fill();
}

function drawDungeon(){
  const camX=clamp(D.px-((VC/2)|0),0,MW-VC), camY=clamp(D.py-((VR/2)|0),0,MH-VR);
  const ox=(540-VC*TILE)/2, oy=70;
  DVIEW={ox,oy,camX,camY};
  const TS = D.tileset || buildTileset(D.floor);
  for(let vy=0; vy<VR; vy++) for(let vx=0; vx<VC; vx++){
    const x=camX+vx, y=camY+vy;
    if(y>=MH||x>=MW||!D.seen[y][x]) continue;
    const vis=Math.abs(x-D.px)<=6&&Math.abs(y-D.py)<=5;
    const tx=ox+vx*TILE, ty=oy+vy*TILE;
    const sp = D.map[y][x]===1 ? TS.wallTile : TS.floorTiles[tileVariant(x,y)];
    ctx.drawImage(sp, 0,0,16,16, tx,ty, TILE,TILE);
    if(!vis){ ctx.fillStyle="rgba(0,0,0,0.55)"; ctx.fillRect(tx,ty,TILE,TILE); }
  }
  const cell=(x,y)=>[ox+(x-camX)*TILE, oy+(y-camY)*TILE];
  const inView=(x,y)=> x>=camX&&x<camX+VC&&y>=camY&&y<camY+VR;
  // ボス階の赤みビネット(オクトパストラベラー風)
  if(D.boss && !D.bossDown){
    const vw=VC*TILE, vh=VR*TILE;
    const vg=ctx.createRadialGradient(ox+vw/2,oy+vh/2,vh*0.25,ox+vw/2,oy+vh/2,vh*0.75);
    vg.addColorStop(0,"rgba(120,10,20,0)"); vg.addColorStop(1,"rgba(120,10,20,0.35)");
    ctx.fillStyle=vg; ctx.fillRect(ox,oy,vw,vh);
  }
  // プレイヤー周囲の暖色グロー
  {
    const gcx=ox+(D.px-camX)*TILE+TILE/2, gcy=oy+(D.py-camY)*TILE+TILE/2, rad=TILE*2.6;
    const glow=ctx.createRadialGradient(gcx,gcy,4,gcx,gcy,rad);
    glow.addColorStop(0,"rgba(255,200,120,0.22)"); glow.addColorStop(1,"rgba(255,200,120,0)");
    ctx.fillStyle=glow; ctx.fillRect(gcx-rad,gcy-rad,rad*2,rad*2);
  }
  if(inView(D.stairs.x,D.stairs.y)&&D.seen[D.stairs.y][D.stairs.x]){ const p=cell(D.stairs.x,D.stairs.y);
    ctx.fillStyle="#c9a44f"; ctx.fillRect(p[0]+6,p[1]+6,TILE-12,TILE-12); text("▼",p[0]+12,p[1]+28,17,"#0b0d12"); }
  for(const it of D.items){ if(!inView(it.x,it.y)||!D.seen[it.y][it.x])continue; const p=cell(it.x,it.y);
    if(it.t==="gold") px(SP_COIN, p[0]+8, p[1]+9+Math.sin(FRAME*0.1+it.x)*1.5, 3);
    else px(SP_BANANA, p[0]+5, p[1]+6+Math.sin(FRAME*0.1+it.x)*1.5, 3); }
  for(const e of D.enemies){ if(e.hp<=0||!inView(e.x,e.y)||!D.seen[e.y][e.x])continue; const p=cell(e.x,e.y);
    const isBat = !e.boss && e.kind.sp===SP_BAT;
    const sway = Math.sin(FRAME*0.09 + e.x*1.7 + e.y*0.6) * (isBat?6:2);
    drawGroundShadow(p[0]+20, p[1]+36, e.boss?24:14);
    px(e.boss?e.sp:e.kind.sp, p[0]+(e.boss?0:2), p[1]+(e.boss?-8:5)+sway, e.boss?1.6:2.2);
    ctx.fillStyle="#40222a"; ctx.fillRect(p[0]+2,p[1]-5,TILE-4,4);
    ctx.fillStyle="#d24a5e"; ctx.fillRect(p[0]+2,p[1]-5,(TILE-4)*clamp(e.hp/e.maxhp,0,1),4); }
  for(const k of D.kids){ if(k.hp<=0||!inView(k.x,k.y))continue; const p=cell(k.x,k.y);
    drawGroundShadow(p[0]+20,p[1]+38,13); px(SP_KID,p[0]+5,p[1]+3,1.9); }
  const pp=cell(D.px,D.py);
  drawGroundShadow(pp[0]+20,pp[1]+40,16);
  px(SP_HERO,pp[0]+2,pp[1]-4+Math.sin(FRAME*0.08)*2,1.6);
  // ダメージポップアップ
  for(let i=FX.length-1;i>=0;i--){
    const f=FX[i];
    if(inView(f.gx,f.gy)){
      const p=cell(f.gx,f.gy), t=f.age/f.maxAge;
      ctx.globalAlpha=clamp(1-t,0,1);
      text(f.txt, p[0]+20, p[1]+20-t*26, 16, f.color, "center");
      ctx.globalAlpha=1;
    }
    f.age++;
    if(f.age>f.maxAge) FX.splice(i,1);
  }
  ctx.fillStyle="rgba(10,12,18,0.9)"; ctx.fillRect(0,0,540,64);
  ctx.fillStyle="#40222a"; ctx.fillRect(14,14,220,18);
  ctx.fillStyle="#5fbf6f"; ctx.fillRect(14,14,220*clamp(S.hp/S.maxhp,0,1),18);
  text("HP "+S.hp+"/"+S.maxhp,20,28,13,"#0b0d12");
  text("地下"+D.floor+"階 "+S.gold+"G "+S.age+"さい"+(D.boss&&!D.bossDown?" ⚠ボス":""),250,29,15,"#e8b93e");
  ctx.fillStyle="rgba(10,12,18,0.85)"; ctx.fillRect(10,676,520,72);
  D.msg.slice(-3).forEach((m,i,arr)=>text(m.length>38? m.slice(0,37)+"…":m,20,698+i*21,13, i===arr.length-1?"#fff":"#998"));
  btnDraw(122,756,96,62,"▲",()=>playerStep(0,-1),{size:24});
  btnDraw(18,824,96,62,"◀",()=>playerStep(-1,0),{size:24});
  btnDraw(122,824,96,62,"・",()=>endTurn(),{size:24,color:"#9aa"});
  btnDraw(226,824,96,62,"▶",()=>playerStep(1,0),{size:24});
  btnDraw(122,892,96,62,"▼",()=>playerStep(0,1),{size:24});
  btnDraw(352,824,170,62,"にげる(帰還)",tryFlee,{size:15});
}
function drawEpilogue(){
  ctx.fillStyle="#0b0d12"; ctx.fillRect(0,0,540,960);
  const cur=S.epPages[S.epIdx];
  const big = S.epIdx===S.epPages.length-2;
  wrapText(cur, 45, 430, 450, big?24:19, big?"#e8b93e":"#f2efe9");
  text((S.epIdx+1)+" / "+S.epPages.length,270,890,12,"#665","center");
  text("▼ タップ/Enter",270,916,13,"#665","center");
}
function drawDialog(){
  const cur=DIALOG.queue[DIALOG.idx];
  const ch=cur.choices? cur.choices.length*56 : 0;
  const h=130+ch;
  const y0=960-h-200;
  ctx.fillStyle="rgba(8,10,16,0.96)"; ctx.fillRect(10,y0,520,h);
  ctx.strokeStyle="#c9a44f"; ctx.strokeRect(10,y0,520,h);
  wrapText(cur.text,30,y0+34,478,17);
  if(cur.choices) cur.choices.forEach((c,i)=>{
    btnDraw(30,y0+h-ch-14+i*56,480,50,c.label,()=>{ DIALOG.choiceIdx=i; dialogInput("ok"); },
      {size:16,bg:i===DIALOG.choiceIdx?"rgba(201,164,79,0.2)":"rgba(25,29,40,0.9)"});
  });
  else text("▼ タップですすむ",270,y0+h-16,12,"#886","center");
}

// ---------- 入力 ----------
let hasSave=false;
function titleStart(){
  if(!(hasSave && load())) newGame();
  hasSave=false;
  S.mode="home"; save();
}
window.addEventListener("keydown", ev=>{
  const k=ev.key;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Up","Down","Left","Right"," "].includes(k)) ev.preventDefault();
  if(S===null || S.mode==="title"){ if(k==="Enter"||k===" ") titleStart(); return; }
  if(S.mode==="epilogue"){
    if(k==="Enter"||k===" "){ S.epIdx++; if(S.epIdx>=S.epPages.length){ S=null; hasSave=false; } }
    return;
  }
  if(DIALOG){
    if(k==="ArrowUp"||k==="Up"||k==="w") dialogInput("up");
    else if(k==="ArrowDown"||k==="Down"||k==="s") dialogInput("down");
    else if(k==="Enter"||k===" ") dialogInput("ok");
    return;
  }
  if(S.mode==="home"){
    const items=homeItems();
    if(k==="ArrowUp"||k==="Up"||k==="w") HMENU.idx=(HMENU.idx+items.length-1)%items.length;
    else if(k==="ArrowDown"||k==="Down"||k==="s") HMENU.idx=(HMENU.idx+1)%items.length;
    else if(k==="Enter"||k===" ") items[HMENU.idx].fn();
    return;
  }
  if(S.mode==="dungeon"){
    if(k==="ArrowUp"||k==="Up"||k==="w") playerStep(0,-1);
    else if(k==="ArrowDown"||k==="Down"||k==="s") playerStep(0,1);
    else if(k==="ArrowLeft"||k==="Left"||k==="a") playerStep(-1,0);
    else if(k==="ArrowRight"||k==="Right"||k==="d") playerStep(1,0);
    else if(k==="."||k==="Enter") endTurn();       // 足ぶみ
    else if(k==="b"||k==="B"){ tryFlee(); }
  }
});
// タッチ: 画面内ボタン+タップ+スワイプ
let tstart=null;
function toCV(ev){ const r=cv.getBoundingClientRect(); return [(ev.clientX-r.left)*cv.width/r.width,(ev.clientY-r.top)*cv.height/r.height]; }
cv.addEventListener("pointerdown", ev=>{ ev.preventDefault(); tstart=[ev.clientX,ev.clientY]; });
cv.addEventListener("pointerup", ev=>{
  if(!tstart) return;
  const [cx,cy]=toCV(ev);
  const dx=ev.clientX-tstart[0], dy=ev.clientY-tstart[1]; tstart=null;
  const isTap = Math.abs(dx)<18 && Math.abs(dy)<18;
  if(isTap){
    for(let i=BTNS.length-1;i>=0;i--){ const b=BTNS[i];
      if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h){ b.fn(); return; } }
  }
  if(S===null || S.mode==="title"){ if(isTap) titleStart(); return; }
  if(S.mode==="epilogue"){ if(isTap){ S.epIdx++; if(S.epIdx>=S.epPages.length){ S=null; hasSave=false; } } return; }
  if(DIALOG){ if(isTap) dialogInput("ok"); else dialogInput(dy>0?"down":"up"); return; }
  if(S.mode==="dungeon"){
    if(isTap){
      if(DVIEW && cy>=DVIEW.oy && cy<DVIEW.oy+VR*TILE && cx>=DVIEW.ox && cx<DVIEW.ox+VC*TILE){
        const tx=DVIEW.camX+((cx-DVIEW.ox)/TILE|0), ty=DVIEW.camY+((cy-DVIEW.oy)/TILE|0);
        const ddx=tx-D.px, ddy=ty-D.py;
        if(ddx||ddy){ if(Math.abs(ddx)>=Math.abs(ddy)) playerStep(Math.sign(ddx),0); else playerStep(0,Math.sign(ddy)); }
      }
      return;
    }
    if(Math.abs(dx)>Math.abs(dy)) playerStep(Math.sign(dx),0); else playerStep(0,Math.sign(dy));
  }
});

// ---------- 起動 ----------
try{ hasSave = !!localStorage.getItem("gorilla-life"); }catch(e){}
S=null;
draw();
</script>
